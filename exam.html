<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>储能培训考试</title>
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,"Microsoft YaHei",Arial,sans-serif;background:#f1f5f9;color:#1e293b;}
  .ex-wrap{max-width:820px;margin:0 auto;padding:24px 16px 60px;}
  h2{margin:0 0 6px;color:#0f172a;}
  .ex-meta{color:#64748b;font-size:13px;margin-bottom:16px;}
  .ex-trainee{margin-bottom:16px;}
  .ex-trainee input{padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;width:240px;}
  .ex-q{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:14px 16px;margin-bottom:12px;}
  .ex-q-t{font-weight:600;margin-bottom:8px;}
  .ex-q-type{color:#2563eb;font-size:12px;font-weight:400;}
  .ex-q-o{display:flex;flex-direction:column;gap:6px;}
  .ex-opt{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;}
  .ex-opt:hover{background:#f8fafc;}
  .ex-submit{margin-top:8px;background:#2563eb;color:#fff;border:0;border-radius:8px;padding:10px 22px;font-size:15px;cursor:pointer;}
  .ex-submit:hover{background:#1d4ed8;}
  .ex-res{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:18px;margin-top:18px;}
  .ex-res h3{margin:0 0 8px;}
  .ex-code{margin-top:12px;}
  .ex-code textarea{width:100%;height:90px;font-family:monospace;font-size:12px;padding:8px;border:1px solid #cbd5e1;border-radius:8px;resize:vertical;}
  .ex-code button{margin-top:6px;background:#16a34a;color:#fff;border:0;border-radius:8px;padding:8px 18px;cursor:pointer;}
  .ex-tip{color:#64748b;font-size:13px;margin-top:10px;}
  .ex-pass{color:#16a34a;font-weight:700;}
  .ex-fail{color:#dc2626;font-weight:700;}
</style>
</head>
<body>
<div class="ex-wrap">
  <h2 id="exTitle">储能培训考试</h2>
  <div id="exMeta" class="ex-meta"></div>
  <div class="ex-trainee"><label>受训者姓名：<input id="exName" placeholder="请输入您的姓名"></label></div>
  <div id="exQuestions"></div>
  <button class="ex-submit" id="exSubmit">提交试卷</button>
  <div id="exResult"></div>
</div>
<script>
(function(){
  function getParam(name){ var m=location.hash.match(new RegExp('#'+name+'=([^&]*)')); return m?m[1]:''; }
  function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];}); }
  var enc=getParam('e');
  var exam=null;
  try{ exam=JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(enc))))); }catch(e){ exam=null; }
  var titleEl=document.getElementById('exTitle');
  var metaEl=document.getElementById('exMeta');
  var qEl=document.getElementById('exQuestions');
  var submitBtn=document.getElementById('exSubmit');
  if(!exam || !exam.questions || !exam.questions.length){
    titleEl.textContent='试卷无效';
    metaEl.innerHTML='链接已损坏或缺失题目数据。<br>请确认链接完整（含 <b>#e=...</b> 片段），或向培训管理员重新获取分享链接。';
    submitBtn.style.display='none';
    return;
  }
  titleEl.textContent=exam.title||'储能培训考试';
  var single=exam.questions.filter(function(q){return q.type==='single';}).length;
  var multi=exam.questions.length-single;
  metaEl.innerHTML='难度：'+(exam.difficulty||'-')+' ｜ 共 '+exam.questions.length+' 题（单选 '+single+' · 多选 '+multi+'）｜ 满分 100 分 ｜ 合格线 ≥ 60 分';
  qEl.innerHTML=exam.questions.map(function(q,idx){
    var inputs=q.options.map(function(op,oi){
      var tag=q.type==='multi'?'checkbox':'radio';
      return '<label class="ex-opt"><input type="'+tag+'" name="exq_'+idx+'" value="'+oi+'"> '+escapeHtml(op)+'</label>';
    }).join('');
    return '<div class="ex-q"><div class="ex-q-t">'+ (idx+1) +'. '+ escapeHtml(q.q) +' <span class="ex-q-type">['+(q.type==='multi'?'多选':'单选')+(q.points?(' · '+q.points+'分'):'')+']</span></div><div class="ex-q-o">'+inputs+'</div></div>';
  }).join('');

  submitBtn.addEventListener('click', function(){
    var name=document.getElementById('exName').value.trim();
    if(!name){ alert('请先填写姓名'); return; }
    var total=0, gained=0;
    exam.questions.forEach(function(q,idx){
      var pts=q.points||1; total+=pts;
      var sel=Array.prototype.slice.call(document.querySelectorAll('input[name="exq_'+idx+'"]:checked')).map(function(el){return parseInt(el.value,10);}).sort();
      var ans=Array.isArray(q.answer)?q.answer.slice().sort():(q.answer==null?[]:[q.answer]);
      if(JSON.stringify(sel)===JSON.stringify(ans)) gained+=pts;
    });
    var pct=total>0?Math.round(gained/total*100):0;
    var passed=pct>=60;
    var d=new Date();
    var submittedAt=d.toISOString().slice(0,10)+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
    var result={trainee:name,score:gained,total:total,submittedAt:submittedAt,examId:exam.id||'shared',difficulty:exam.difficulty,title:exam.title};
    // 同源浏览器：尝试直接写入主系统 localStorage 聚合
    try{
      var raw=localStorage.getItem('ess_delivery_v1.2');
      if(raw){ var st=JSON.parse(raw); if(st&&st.training&&Array.isArray(st.training.submissions)){ st.training.submissions.push({id:'sub_'+Date.now(),examId:result.examId,trainee:name,score:gained,total:total,passed:passed,submittedAt:submittedAt,shared:true}); localStorage.setItem('ess_delivery_v1.2',JSON.stringify(st)); } }
    }catch(e){}
    var code=btoa(unescape(encodeURIComponent(JSON.stringify(result))));
    var rc=document.getElementById('exResult');
    rc.innerHTML='<div class="ex-res"><h3>答题完成</h3>'
      +'<p>得分：<b>'+gained+' / '+total+'</b>（'+pct+' 分）</p>'
      +'<p>结果：'+(passed?'<span class="ex-pass">合格</span>':'<span class="ex-fail">不合格</span>')+'</p>'
      +'<div class="ex-code"><label>成绩回传码（发给培训管理员计入统计）：</label><textarea id="exCode" readonly>'+code+'</textarea>'
      +'<button type="button" onclick="copyCode()">复制回传码</button></div>'
      +'<p class="ex-tip">将上方回传码发给培训管理员，由其在培训系统「成绩查询 → 回传码入账」中粘贴即可自动计入成绩统计。</p></div>';
    rc.scrollIntoView();
  });
  window.copyCode=function(){ var ta=document.getElementById('exCode'); if(!ta) return; ta.select(); try{document.execCommand('copy');alert('已复制回传码');}catch(e){alert('复制失败，请手动复制');} };
})();
</script>
</body>
</html>
