<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESS交付管理系统 v1.9.7 | ArcBank1.0 储能系统全生命周期交付管控</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ==================== L1: 项目库 ==================== -->
<div class="header-bar" id="headerBar">
  <div class="logo">⚡ ESS<span>交付管理</span></div>
  <div class="proj-selector">
    <select id="projectSelect" onchange="App.selectProject(this.value)">
      <option value="">加载中...</option>
    </select>
    <div class="proj-params" id="projParams"></div>
  </div>
  <div class="header-actions">
    <button onclick="App.showImportCSVModal()" title="导入CSV格式项目列表">📥 导入项目</button>
    <button onclick="App.showAddProjectModal()">+ 新增项目</button>
  </div>
</div>

<!-- ==================== L2: 总进度轴 ==================== -->
<div class="progress-bar-container" id="progressBarContainer">
  <div class="progress-axis" id="progressAxis"></div>
</div>

<!-- ==================== L3: Tab区域 ==================== -->
<div class="dashboard-main" id="dashboardMain">
  <div class="tab-nav" id="tabNav"></div>
  <div class="tab-content active" id="tabContent"></div>
</div>

<!-- ==================== L4: 可折叠信息卡 ==================== -->
<div class="foldable-section" id="foldableSection">
  <div class="foldable-toggle" onclick="App.toggleFoldable()">
    <span class="arrow">▶</span> 全局风险与关键指标看板
  </div>
  <div class="foldable-content" id="foldableContent"></div>
</div>

<!-- ==================== L5: 操作栏 ==================== -->
<div class="action-bar">
  <button class="btn btn-primary" onclick="App.saveAll()">💾 保存</button>
  <button class="btn btn-warning" onclick="App.resetCurrent()">🔄 重置</button>
  <button class="btn" onclick="App.exportCSV()">📄 导出CSV</button>
  <button class="btn" onclick="App.downloadPDF()">📥 下载PDF</button>
</div>

<!-- ==================== 版权 ==================== -->
<div class="footer-bar">© 2026 ESS交付管理系统 v1.9.7 | ArcBank1.0 储能系统全生命周期交付管控平台 | 江苏中信博新能源科技股份有限公司 | 开发者：郑丹 <span style="margin-left:8px;">|</span> <a id="contactLink" href="#" onclick="App.openContactEmail();return false;" style="color:#3b82f6;text-decoration:none;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:4px;transition:color 0.2s;" onmouseover="this.style.color='#2563eb';this.style.textDecoration='underline';" onmouseout="this.style.color='#3b82f6';this.style.textDecoration='none';">📧 与我联系</a></div>

<!-- 弹窗容器 -->
<div id="modalContainer"></div>

<!-- Toast -->
<div id="toastContainer"></div>

<!-- Scripts: CDN库（PDF导出依赖） -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<!-- 业务脚本（添加版本号清除缓存） -->
<script src="js/store.js?v=1.9.7"></script>
<script src="js/chart.js?v=1.9.7"></script>
<script src="js/app.js?v=1.9.7"></script>

<script>
// 调试指示器 - 帮助定位白屏问题
console.log('=== ESS交付管理系统 v1.9.7 调试信息 ===');
console.log('页面开始加载:', new Date().toLocaleTimeString());

// 检查脚本加载状态
window.addEventListener('error', function(e) {
  console.error('❌ 加载错误:', e.message, 'at', e.filename, 'line', e.lineno);
  document.body.innerHTML = '<div style="padding:40px;font-family:monospace;color:#dc2626;"><h2>❌ 脚本加载错误</h2><p><strong>错误:</strong> ' + e.message + '</p><p><strong>文件:</strong> ' + e.filename + '</p><p><strong>行号:</strong> ' + e.lineno + '</p><hr><p>请按F12打开控制台查看详细信息</p></div>';
});

document.addEventListener('DOMContentLoaded', function() {
  console.log('✅ DOM加载完成');
  try {
    if (typeof App !== 'undefined' && App.init) {
      console.log('✅ App对象已就绪，开始初始化...');
      App.init();
    } else {
      console.error('❌ App对象未定义！');
      document.body.innerHTML = '<div style="padding:40px;font-family:monospace;color:#dc2626;"><h2>❌ App对象未定义</h2><p>可能原因：</p><ul><li>js/app.js 加载失败</li><li>js/app.js 有语法错误</li><li>js/store.js 加载失败</li></ul><hr><p>请按F12打开控制台查看详细信息</p></div>';
    }
  } catch(e) {
    console.error('❌ 初始化失败:', e.message);
    document.body.innerHTML = '<div style="padding:40px;font-family:monospace;color:#dc2626;"><h2>❌ 初始化失败</h2><p><strong>错误:</strong> ' + e.message + '</p><p><strong>堆栈:</strong> <pre>' + e.stack + '</pre></p></div>';
  }
});
</script>

</body>
</html>
